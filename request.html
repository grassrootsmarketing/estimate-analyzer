<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Request an estimate</title>
<style>
  @font-face{font-family:"Instrument";font-style:normal;font-weight:400;font-display:swap;src:url(/vendor/fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(/vendor/fonts/inter-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(/vendor/fonts/inter-latin-600-normal.woff2) format("woff2")}
  :root{
    --bg:#f0eee6; --panel:#faf9f5; --panel2:#ebe7dc; --line:#dedace;
    --ink:#141413; --muted:#6e6a61; --accent:#d97757; --accent2:#a8492a;
    --good:#2c7a55; --bad:#b0432c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:26px 16px 48px}
  .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent2);font-weight:700;font-family:"Inter",sans-serif}
  h1{font-family:"Instrument",Georgia,serif;font-weight:400;font-size:34px;letter-spacing:-.015em;line-height:1.1;margin:6px 0 6px}
  .sub{color:var(--muted);font-size:14.5px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px}
  .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.03em;margin:14px 0 5px}
  .lbl:first-child{margin-top:0}
  input,textarea,select{width:100%;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15.5px;line-height:1.4;font-family:inherit}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent2)}
  textarea{min-height:96px;resize:vertical}
  .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:420px){.g2{grid-template-columns:1fr}}
  .btn{width:100%;margin-top:20px;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff7f2;font-size:16px;font-weight:700;font-family:"Inter",sans-serif;cursor:pointer}
  .btn:disabled{opacity:.55}
  .msg{margin-top:12px;font-size:14px;min-height:20px}
  .msg.bad{color:var(--bad)}
  .done{text-align:center;padding:34px 10px}
  .done .big{font-family:"Instrument",Georgia,serif;font-size:28px;font-weight:400;letter-spacing:-.012em;margin:10px 0 6px}
  .done .tick{width:56px;height:56px;border-radius:50%;background:rgba(33,122,75,.12);color:var(--good);display:flex;align-items:center;justify-content:center;margin:0 auto;font-size:28px}
  .foot{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
  .hp{position:absolute;left:-9999px;top:-9999px;height:0;overflow:hidden}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker" id="who">Request an estimate</div>
  <h1>Tell us about your job</h1>
  <p class="sub">Takes about a minute. You'll get a call or text back to talk through it; no spam, no obligation.</p>

  <div class="card" id="formCard">
    <form id="f" novalidate>
      <span class="lbl">Your name</span>
      <input id="name" autocomplete="name" placeholder="First and last name" maxlength="80" required>
      <div class="g2">
        <div><span class="lbl">Phone</span><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="(323) 555-0134" maxlength="40"></div>
        <div><span class="lbl">Email (optional)</span><input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@email.com" maxlength="80"></div>
      </div>
      <span class="lbl">What do you need done?</span>
      <textarea id="desc" placeholder="e.g. Two bathrooms, demo and retile, about 120 square feet. Would love it done before the holidays." maxlength="600" required></textarea>
      <div class="g2">
        <div><span class="lbl">City or area</span><input id="area" placeholder="e.g. Highland Park" maxlength="120"></div>
        <div><span class="lbl">When?</span>
          <select id="timing">
            <option value="">Pick one…</option>
            <option>As soon as possible</option>
            <option>In the next month</option>
            <option>1 to 3 months out</option>
            <option>Just planning ahead</option>
          </select>
        </div>
      </div>
      <div class="hp" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div>
      <button class="btn" id="go" type="submit">Send my request</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </div>

  <div class="card done" id="doneCard" style="display:none">
    <div class="tick">✓</div>
    <div class="big">Request sent</div>
    <p class="sub" style="margin:0" id="doneSub">Thanks! Expect a call or text back soon.</p>
  </div>

  <p class="foot" id="brandFoot"></p>
</div>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var to=(q.get("to")||"").toLowerCase();
  var co=(q.get("c")||"").slice(0,60);
  if(co){ document.getElementById("who").textContent="Request an estimate from "+co; document.title="Request an estimate · "+co;
    document.getElementById("brandFoot").textContent=co;
    document.getElementById("doneSub").textContent="Thanks! "+co+" will call or text you back soon."; }
  var f=document.getElementById("f"), msg=document.getElementById("msg"), go=document.getElementById("go");
  if(!/^[0-9a-f]{64}$/.test(to)){
    document.getElementById("formCard").innerHTML='<p class="sub" style="margin:0">This request link is incomplete. Ask for a fresh link and try again.</p>';
  }
  f.addEventListener("submit", async function(ev){
    ev.preventDefault();
    var v=function(id){ return document.getElementById(id).value.trim(); };
    if(v("name").length<2){ msg.className="msg bad"; msg.textContent="Please add your name."; return; }
    if(!v("phone") && !v("email")){ msg.className="msg bad"; msg.textContent="Add a phone number or email so we can reach you."; return; }
    if(v("desc").length<5){ msg.className="msg bad"; msg.textContent="Tell us a little about the job."; return; }
    go.disabled=true; msg.className="msg"; msg.textContent="Sending…";
    try{
      var r=await fetch("/api/lead",{method:"POST",headers:{"content-type":"application/json"},
        body:JSON.stringify({op:"submit", to:to, name:v("name"), phone:v("phone"), email:v("email"),
          desc:v("desc"), area:v("area"), timing:v("timing"), website:v("website")})});
      var d=null; try{ d=await r.json(); }catch(e){}
      if(!r.ok) throw new Error((d&&d.error)||("HTTP "+r.status));
      document.getElementById("formCard").style.display="none";
      document.getElementById("doneCard").style.display="";
      window.scrollTo(0,0);
    }catch(err){
      go.disabled=false; msg.className="msg bad";
      msg.textContent=(err&&err.message)||"Couldn't send that. Check your connection and try again.";
    }
  });
})();
</script>
</body>
</html>
