<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Project update</title>
<style>
  @font-face{font-family:"Instrument";font-style:normal;font-weight:400;font-display:swap;src:url(/vendor/fonts/instrument-serif-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(/vendor/fonts/inter-latin-400-normal.woff2) format("woff2")}
  @font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(/vendor/fonts/inter-latin-600-normal.woff2) format("woff2")}
  :root{
    --bg:#f0eee6; --panel:#faf9f5; --panel2:#ebe7dc; --line:#dedace;
    --ink:#141413; --muted:#6e6a61; --accent:#d97757; --accent2:#a8492a;
    --good:#2c7a55; --bad:#b0432c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
  .co{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .co img{height:34px;width:auto;max-width:120px;object-fit:contain;border-radius:6px}
  .co .nm{font-family:"Inter",sans-serif;font-weight:700;font-size:16px}
  h1{font-family:"Instrument",Georgia,serif;font-weight:400;font-size:31px;letter-spacing:-.015em;line-height:1.1;margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
  .card h2{font-family:"Inter",sans-serif;font-size:13px;font-weight:600;letter-spacing:0;color:var(--muted);margin:0 0 12px}
  /* stage timeline */
  .steps{display:flex;gap:6px}
  .step{flex:1;text-align:center}
  .step .bar{height:6px;border-radius:3px;background:var(--panel2);margin-bottom:7px}
  /* Progress is one hue getting stronger, not a colour change. Green is reserved
     for money that has actually landed. */
  .step.on .bar{background:var(--accent);opacity:.45}
  .step.now .bar{background:var(--accent);opacity:1}
  .step .t{font-size:10.5px;color:var(--muted);letter-spacing:.02em}
  .step.now .t{color:var(--accent2);font-weight:600}
  .bignow{font-family:"Instrument",Georgia,serif;font-size:24px;font-weight:400;letter-spacing:-.012em;margin:12px 0 2px}
  .prog{font-size:13px;color:var(--muted)}
  /* work log rows: done so far + what's coming up */
  .wl{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .wl:last-child{border-bottom:0}
  .wt{width:22px;height:22px;border-radius:50%;background:var(--panel2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:0 0 auto}
  .wt.done{background:rgba(33,122,75,.12);color:var(--good)}
  .wn{flex:1;min-width:0}
  .wl.donerow .wn{color:var(--muted)}
  .wd{color:var(--muted);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
  .kv:last-child{border-bottom:0}
  .kv .k{color:var(--muted)}
  .kv .v{font-variant-numeric:tabular-nums;font-weight:500}
  .money{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
  .mt{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
  .mt .l{font-size:11.5px;color:var(--muted);letter-spacing:0}
  .mt .v{font-family:"Inter",sans-serif;font-size:16px;font-weight:700;margin-top:3px}
  .chip{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--panel2);color:var(--muted)}
  .chip.paid{background:rgba(33,122,75,.12);color:var(--good)}
  .chip.invoiced{background:rgba(185,131,28,.14);color:#7a531a}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;cursor:pointer}
  .foot{text-align:center;color:var(--muted);font-size:12.5px;margin-top:20px}
  .foot a{color:var(--accent2);text-decoration:none;font-weight:600}
  .empty{padding:60px 20px;text-align:center;color:var(--muted)}
  #lightbox{position:fixed;inset:0;background:rgba(7,20,11,.94);display:none;align-items:center;justify-content:center;z-index:50}
  #lightbox img{max-width:96vw;max-height:92vh;border-radius:10px}
  /* Summary and projection styling. kvtot is the line a client's eye should land
     on; vlate flags a date that has moved past the original target. */
  .kvtot{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .kvtot .k{color:var(--ink);font-weight:600}
  .kvtot .v{font-family:"Instrument",Georgia,serif;font-size:21px;letter-spacing:-.012em}
  .vgood{color:var(--good)}
  .vlate{color:var(--accent2);font-weight:600}
  .note{margin:12px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted)}
  .konsub{display:block;font-size:11px;color:var(--muted);margin-top:2px;font-weight:400}
  .cosplit{margin:14px 0 8px;font-size:12px;font-weight:600;letter-spacing:0;color:var(--muted)}
  .wd.wlate{color:var(--accent2);font-weight:600}
  .wd.wtbd{color:var(--muted);font-style:normal;opacity:.85}
  .wt.tlate{background:rgba(217,119,87,.14);color:var(--accent2)}
  /* homeowner actions + callouts */
  .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .abtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-family:"Inter",sans-serif;font-size:14px;font-weight:600;padding:11px 15px;border-radius:12px;border:1px solid var(--line);color:var(--ink);background:var(--panel);min-height:44px;flex:1 1 auto}
  .abtn.primary{background:var(--accent2);border-color:var(--accent2);color:#fff}
  .abtn:active{transform:scale(.98)}
  .todo{display:flex;gap:11px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
  .todo:last-child{border-bottom:0}
  .todo .ti{width:26px;height:26px;border-radius:50%;background:rgba(217,119,87,.14);color:var(--accent2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
  .todo .tx{flex:1;min-width:0;font-size:14.5px;font-weight:500}
  .todo .tx .s{display:block;color:var(--muted);font-size:12.5px;font-weight:400;margin-top:1px}
  .card.attn{border-color:var(--accent)}
  .duenow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:rgba(217,119,87,.10);border:1px solid rgba(217,119,87,.32);border-radius:12px;padding:11px 13px;margin:2px 0 10px}
  .duenow .l{font-size:13px;color:var(--accent2);font-weight:600}
  .duenow .v{font-family:"Instrument",Georgia,serif;font-size:20px;color:var(--accent2)}
  .savehint{text-align:center;color:var(--muted);font-size:12px;line-height:1.5;margin-top:16px}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Loading your project…</div></div>
<div id="lightbox" onclick="this.style.display='none'"><img id="lightimg" alt=""></div>
<script>
(function(){
  var esc=function(v){ return String(v==null?"":v).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); };
  var money=function(v){ v=+v||0; return "$"+v.toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2}); };
  var day=function(d){ if(!d) return ""; var p=d.split("-"); return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}); };
  var telHref=function(p){ return "tel:"+String(p||"").replace(/[^\d+]/g,""); };
  var smsHref=function(p,body){ var d=String(p||"").replace(/[^\d+]/g,""); return "sms:"+d+(body?"?&body="+encodeURIComponent(body):""); };
  var mailHref=function(em,subj,body){ return "mailto:"+String(em||"").trim()+"?subject="+encodeURIComponent(subj||"")+(body?"&body="+encodeURIComponent(body):""); };
  function approveCO(btn){
    var co=btn.getAttribute("data-co")||"", amt=btn.getAttribute("data-amt")||"";
    if(!co) return;
    if(!confirm("Approve this change"+(amt?" ("+amt+")":"")+"? It will be added to your contract total and your contractor will be notified.")) return;
    btn.disabled=true; var old=btn.textContent; btn.textContent="Sending…";
    fetch("/api/portal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({op:"approve",token:k,co:co})})
    .then(function(r){ return r.ok; })
    .then(function(ok){
      if(ok){ var wrap=btn.parentElement; if(wrap) wrap.innerHTML='<span class="chip paid">Approved</span> <span class="konsub" style="display:inline;margin-left:6px">Sent to your contractor</span>'; }
      else { btn.disabled=false; btn.textContent=old; alert("Couldn't send that. Please text your contractor to approve."); }
    })
    .catch(function(){ btn.disabled=false; btn.textContent=old; alert("Couldn't send that. Please text your contractor to approve."); });
  }
  var app=document.getElementById("app");
  var k=(new URLSearchParams(location.search).get("k")||"").toLowerCase();
  if(!/^[0-9a-f]{32}$/.test(k)){ app.innerHTML='<div class="empty">This link is incomplete. Ask for a fresh one.</div>'; return; }
  fetch("/api/portal",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({op:"get",token:k})})
  .then(function(r){ return r.json().then(function(d){ return {ok:r.ok,d:d}; }); })
  .then(function(res){
    if(!res.ok){ app.innerHTML='<div class="empty">'+esc((res.d&&res.d.error)||"This portal isn't active.")+'</div>'; return; }
    var s; try{ s=JSON.parse(res.d.data); }catch(e){ app.innerHTML='<div class="empty">Something went wrong loading this project.</div>'; return; }
    var co=s.company||{}, job=s.job||{}, prog=s.progress||{};
    document.title=(job.name||"Project update")+(co.name?(" · "+co.name):"");
    var STEPS=[["bidding","Estimate"],["upnext","Scheduled"],["active","In progress"],["complete","Complete"]];
    var idx=Math.max(0,STEPS.findIndex(function(st){return st[0]===job.stage;}));
    if(job.stage==="lead") idx=0;
    var html='';
    html+='<div class="co">'+(co.logo?'<img src="'+esc(co.logo)+'" alt="">':'')+'<span class="nm">'+esc(co.name||"Your contractor")+'</span></div>';
    html+='<h1>'+esc(job.name)+'</h1><p class="sub">'+(job.client?("Prepared for "+esc(job.client)+" · "):"")+'updated '+(s.ts?new Date(s.ts).toLocaleDateString(undefined,{month:"short",day:"numeric"}):"recently")+'</p>';
    /* status */
    html+='<div class="card"><h2>Where things stand</h2><div class="steps">'+STEPS.map(function(st,i){
      return '<div class="step'+(i<idx?' on':'')+(i===idx?' now':'')+'"><div class="bar"></div><div class="t">'+st[1]+'</div></div>';
    }).join("")+'</div><div class="bignow">'+esc(job.stageLabel||"")+'</div>'+
    (prog.total?'<div class="prog">'+prog.done+' of '+prog.total+' work items complete</div>':'')+
    (job.next&&job.next.title&&!(s.work&&s.work.upcoming&&s.work.upcoming.length)?'<div class="prog" style="margin-top:4px;color:var(--accent2);font-weight:600">Up next: '+esc(job.next.title)+(job.next.due?' · '+day(job.next.due):'')+'</div>':'')+'</div>';
    /* Reusable contact actions (text / email / call), used here and in the footer */
    var actionBtns=function(prefill, subj){
      var out=[];
      if(co.phone) out.push('<a class="abtn primary" href="'+esc(smsHref(co.phone,prefill||""))+'">Text '+esc(co.name||"us")+'</a>');
      if(co.email) out.push('<a class="abtn" href="'+esc(mailHref(co.email,subj||("Question about "+(job.name||"my project")),prefill||""))+'">Email</a>');
      if(co.phone) out.push('<a class="abtn" href="'+esc(telHref(co.phone))+'">Call</a>');
      return out.length?'<div class="actions">'+out.join("")+'</div>':"";
    };
    /* what's needed from you: pending change approvals and any amount due now */
    var pendCO=(s.changes||[]).filter(function(c){ return c.status==="pending"; });
    var dueNow=0; ((s.money&&s.money.draws)||[]).forEach(function(d){ if(d.status==="invoiced") dueNow+=(+d.amount||0); });
    var todos=[];
    pendCO.forEach(function(c){
      var amt=(typeof c.amount==="number")?((c.amount<0?"-":"+")+money(Math.abs(c.amount))):"";
      todos.push({ic:"?",co:c.id,amt:amt,qtitle:((c.number?c.number+": ":"")+c.title),
        title:"Approve "+((c.number?c.number+" · ":"")+c.title),sub:(amt?amt+" · ":"")+"awaiting your OK"});
    });
    if(dueNow>0) todos.push({ic:"$",title:"Payment due: "+money(dueNow),sub:"invoiced, awaiting payment",
      prefill:"Hi "+(co.name||"")+", I'd like to arrange the "+money(dueNow)+" payment for "+(job.name||"the project")+".",subj:"Payment for "+(job.name||"project"),primary:"Arrange payment"});
    if(todos.length){
      html+='<div class="card attn"><h2>What\'s needed from you</h2>'+todos.map(function(t){
        var acts;
        if(t.co){
          acts='<div class="actions" style="margin-top:8px"><button type="button" class="abtn primary co-approve" data-co="'+esc(t.co)+'" data-amt="'+esc(t.amt||"")+'">Approve</button>'+
            (co.phone?'<a class="abtn" href="'+esc(smsHref(co.phone,"Question about "+t.qtitle))+'">Ask a question</a>':'')+'</div>';
        } else {
          acts=(co.phone||co.email)?'<div class="actions" style="margin-top:8px">'+
            (co.phone?'<a class="abtn primary" href="'+esc(smsHref(co.phone,t.prefill))+'">'+esc(t.primary)+'</a>':'')+
            (co.email?'<a class="abtn" href="'+esc(mailHref(co.email,t.subj,t.prefill))+'">Email</a>':'')+'</div>':'';
        }
        return '<div class="todo"><span class="ti">'+t.ic+'</span><span class="tx">'+esc(t.title)+'<span class="s">'+esc(t.sub)+'</span>'+acts+'</span></div>';
      }).join("")+'</div>';
    }
    /* your project: the scope of work the client agreed to */
    if(job.scope){
      html+='<div class="card"><h2>Your project</h2><p style="margin:0;font-size:14.5px;line-height:1.6;white-space:pre-wrap">'+esc(job.scope)+'</p></div>';
    }
    /* Summary: one card that answers "where does this stand" in money and time,
       so a client does not have to assemble it from four sections below. */
    var tl=s.timeline||{}, m0=s.money||null;
    var summaryRows=[];
    if(m0){
      summaryRows.push(["Original contract", money(m0.base!=null?m0.base:m0.contract), ""]);
      if(m0.approvedChanges) summaryRows.push(["Approved changes", (m0.approvedChanges<0?"-":"+")+money(Math.abs(m0.approvedChanges)), ""]);
      summaryRows.push(["Contract total", money(m0.contract), "tot"]);
      summaryRows.push(["Paid to date", money(m0.paid), "good"]);
      summaryRows.push(["Balance remaining", money(m0.balance), ""]);
    }
    if(tl.start) summaryRows.push([job.started?"Work started":"Planned start", day(tl.start), ""]);
    if(job.completed) summaryRows.push(["Completed", day(job.completed), "good"]);
    else if(tl.projected) summaryRows.push([tl.slip>0?"Projected finish":"Target finish", day(tl.projected), tl.slip>0?"late":""]);
    if(prog.total) summaryRows.push(["Work complete", prog.done+" of "+prog.total+" phases", ""]);
    if(summaryRows.length){
      html+='<div class="card"><h2>Summary</h2>'+summaryRows.map(function(r){
        return '<div class="kv'+(r[2]==="tot"?" kvtot":"")+'"><span class="k">'+esc(r[0])+
          '</span><span class="v'+(r[2]==="good"?" vgood":(r[2]==="late"?" vlate":""))+'">'+r[1]+'</span></div>';
      }).join("");
      if(tl.slip>0) html+='<p class="note">Running about '+tl.slip+' day'+(tl.slip===1?"":"s")+' past the original target of '+day(tl.target)+'. Your contractor will confirm the finish date as the remaining phases are scheduled.</p>';
      if(m0&&m0.pendingChanges) html+='<p class="note">'+money(Math.abs(m0.pendingChanges))+' in changes is awaiting your approval and is not included in the contract total above.</p>';
      html+='</div>';
    }
    /* work log: done so far, then what's coming up */
    var w=s.work||{};
    if(w.done&&w.done.length){
      html+='<div class="card"><h2>Done so far</h2>'+w.done.map(function(t){
        return '<div class="wl donerow"><span class="wt done">✓</span><span class="wn">'+esc(t.title)+'</span>'+(t.on?'<span class="wd">'+day(t.on)+'</span>':'')+'</div>';
      }).join("")+'</div>';
    }
    if(w.upcoming&&w.upcoming.length){
      html+='<div class="card"><h2>What\'s coming up</h2>'+w.upcoming.map(function(t,i){
        var d2=t.due?'<span class="wd'+(t.late?' wlate':'')+'">'+day(t.due)+'</span>':'<span class="wd wtbd">to be scheduled</span>';
        return '<div class="wl"><span class="wt'+(t.late?' tlate':'')+'">'+(i+1)+'</span><span class="wn">'+esc(t.title)+'</span>'+d2+'</div>';
      }).join("")+
      '<p class="note">Dates are projections and move as work and inspections are scheduled.</p></div>';
    }
    /* schedule */
    if(job.schedStart||job.schedTarget||job.started||job.completed){
      html+='<div class="card"><h2>Schedule</h2>';
      if(job.started) html+='<div class="kv"><span class="k">Work started</span><span class="v">'+day(job.started)+'</span></div>';
      else if(job.schedStart) html+='<div class="kv"><span class="k">Planned start</span><span class="v">'+day(job.schedStart)+'</span></div>';
      if(job.completed) html+='<div class="kv"><span class="k">Completed</span><span class="v">'+day(job.completed)+'</span></div>';
      else {
        if(job.schedTarget) html+='<div class="kv"><span class="k">Original target</span><span class="v">'+day(job.schedTarget)+'</span></div>';
        if(tl.projected&&tl.projected!==job.schedTarget) html+='<div class="kv"><span class="k">Projected finish</span><span class="v vlate">'+day(tl.projected)+'</span></div>';
      }
      html+='</div>';
    }
    /* photos */
    if(s.photos&&s.photos.length){
      html+='<div class="card"><h2>Progress photos</h2><div class="grid">'+s.photos.map(function(p,i){
        return '<img src="'+esc(p)+'" data-i="'+i+'" alt="Progress photo '+(i+1)+'">';
      }).join("")+'</div></div>';
    }
    /* money */
    if(s.money){
      var m=s.money;
      html+='<div class="card"><h2>Payments</h2><div class="money">'+
        '<div class="mt"><div class="l">Contract</div><div class="v">'+money(m.contract)+'</div></div>'+
        '<div class="mt"><div class="l">Paid</div><div class="v" style="color:var(--good)">'+money(m.paid)+'</div></div>'+
        '<div class="mt"><div class="l">Balance</div><div class="v">'+money(m.balance)+'</div></div></div>';
      var dueNowP=0; (m.draws||[]).forEach(function(d){ if(d.status==="invoiced") dueNowP+=(+d.amount||0); });
      if(dueNowP>0) html+='<div class="duenow"><span class="l">Due now</span><span class="v">'+money(dueNowP)+'</span></div>';
      (m.draws||[]).forEach(function(d){
        var chip=d.status==="paid"?'<span class="chip paid">Paid</span>':(d.status==="invoiced"?'<span class="chip invoiced">Invoiced</span>':'<span class="chip">Upcoming</span>');
        html+='<div class="kv"><span class="k">'+esc(d.label)+'</span><span class="v">'+money(d.amount)+' '+chip+'</span></div>';
      });
      html+='</div>';
    }
    /* change orders: approved and awaiting approval, amounts only when money is shared */
    if(s.changes&&s.changes.length){
      var appr=s.changes.filter(function(c){ return c.status==="approved"; });
      var pend=s.changes.filter(function(c){ return c.status==="pending"; });
      var corow=function(c){
        var chip=c.status==="approved"?'<span class="chip paid">Approved</span>':'<span class="chip invoiced">Awaiting approval</span>';
        var amt=(typeof c.amount==="number")?'<span class="v">'+(c.amount<0?"-":"+")+money(Math.abs(c.amount))+'</span>':'';
        return '<div class="kv"><span class="k">'+esc((c.number?c.number+" · ":"")+c.title)+' '+chip+
          (c.on?'<span class="konsub">Approved '+day(c.on)+'</span>':'')+'</span>'+amt+'</div>';
      };
      html+='<div class="card"><h2>Additional costs</h2>';
      if(appr.length){
        html+=appr.map(corow).join("");
        if(m0&&m0.approvedChanges) html+='<div class="kv kvtot"><span class="k">Added to your contract</span><span class="v">'+(m0.approvedChanges<0?"-":"+")+money(Math.abs(m0.approvedChanges))+'</span></div>';
      }
      if(pend.length){
        html+='<div class="cosplit">Not yet approved, not in your total</div>'+pend.map(function(c){
          var amt=(typeof c.amount==="number")?((c.amount<0?"-":"+")+money(Math.abs(c.amount))):"";
          var acts='<div class="actions" style="margin:2px 0 6px"><button type="button" class="abtn primary co-approve" data-co="'+esc(c.id)+'" data-amt="'+esc(amt)+'">Approve</button>'+
            (co.phone?'<a class="abtn" href="'+esc(smsHref(co.phone,"Question about "+((c.number?c.number+": ":"")+c.title)))+'">Ask a question</a>':'')+'</div>';
          return corow(c)+acts;
        }).join("");
        html+='<p class="sub" style="margin:8px 0 0;font-size:12.5px">Approving adds the change to your contract total and lets '+esc((s.company&&s.company.name)||"your contractor")+' know.</p>';
      }
      html+='</div>';
    }
    /* contact + save hint */
    if(co.phone||co.email){
      html+='<div class="card"><h2>Questions?</h2><p class="sub" style="margin:0 0 2px">Reach '+esc(co.name||"your contractor")+' anytime.</p>'+actionBtns()+'</div>';
    }
    html+='<div class="savehint">Bookmark this page to check progress anytime. Only people with your link can see it.</div>';
    app.innerHTML=html;
    app.querySelectorAll(".grid img").forEach(function(im){
      im.onclick=function(){ document.getElementById("lightimg").src=im.src; document.getElementById("lightbox").style.display="flex"; };
    });
    app.querySelectorAll(".co-approve").forEach(function(b){ b.onclick=function(){ approveCO(b); }; });
  })
  .catch(function(){ app.innerHTML='<div class="empty">Couldn\'t load this project. Check your connection and try again.</div>'; });
})();
</script>
</body>
</html>
